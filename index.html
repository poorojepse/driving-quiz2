<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">	
	<link rel="stylesheet" href="style.css">
	<title>LTO Driving Exam Quiz - NP to PL</title>
</head>
<body>
<div id="quiz-overlay">
	<div id="shuffle-toggle">
		<p>Would you prefer randomized choices?</p>
	  <div class="toggle-switch off" id="shuffle-switch">
		<div class="toggle-option off">OFF</div>
		<div class="toggle-option on">ON</div>
	  </div>
	  <input type="checkbox" id="shuffle-checkbox">
	</div>
	<div id="order-toggle">
	  <p>Randomize question order?</p>
	  <div class="toggle-switch off" id="order-switch">
		<div class="toggle-option off">OFF</div>
		<div class="toggle-option on">ON</div>
	  </div>
	  <input type="checkbox" id="order-checkbox">
	</div>
	<div id="pinned-section" style="margin-top:20px; text-align:center;">
	  <button id="start-pinned-btn">📌 Start Pinned Quiz (<span id="pinned-count-overlay">0</span>)</button>
	  <button id="clear-pinned-btn">🗑️ Clear Pinned</button>
	</div>


	<button id="start-quiz-btn">Start Quiz</button>
</div>




	<h1 id="quiz-title">LTO Driving Exam<br>A, A1, B, B1, B2</h1>
	<div class="top-bar">
		<div class="score-display" id="score">✅ 0 / ❎ 0</div>
		<div class="question-count">
		  <input type="number" id="question-input" min="1">
		  <span id="total-display" style="margin: 0 8px;">/ 3</span>
		  <button id="go-btn">Go</button>
		  <button id="pin-btn" class="pin-btn">📌 (<span id="pinned-count-btn">0</span>)</button>
		</div>
	</div>


	<div class="question-text" id="question"></div>

	

	<!-- Use div instead of form -->
	<div class="answers" id="answers">
	</div>

	<button class="next-btn" id="next">Next</button>
	<div class="answer-display" id="answer-display"></div>

<div id="final-summary" style="display:none; margin-top: 30px; font-size: 1.2em; text-align: center;"></div>

<div id="live-review" style="display:none; margin-top:30px;">
  <hr>
  <h3>🧠 Review Incorrect Answers</h3>
  <div id="review-list"></div>
</div>

	<script id="xml-data" type="text/xml">
<questions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
	<question>
		<text>What traffic violation have you committed if you pick-up passengers on prohibited zones?</text>
		<a>Discourtesy to motorist</a>
		<b>Reckless driving</b>
		<c correct="true">Obstructing the free flow of traffic</c>
	</question>
	<question>
		<text>A driver on a highway shall yield the right of way to:</text>
		<a correct="true">police, fire department vehicles, and ambulances when such vehicles are on official business</a>
		<b>public utility vehicles</b>
		<c>politicians when such vehicles are on official business</c>
	</question>
	<question>
		<text>The vehicle you are driving is stalled on a two-way (opposite direction) highway, you should place the Early Warning Device (EWD):</text>
		<a>2 meters at the back and front of the stalled vehicle</a>
		<b>3 meters at the back and front of the stalled vehicle</b>
		<c correct="true">4 meters at the back and front of the stalled vehicle</c>
	</question>
	<question>
		<text>Children must be held in approved child restraint if they are:</text>
		<a>7 years old and below</a>
		<b correct="true">6 years old and below</b>
		<c>8 years old and below</c>
	</question>
</questions>
	</script>

	<script src="script.js" defer></script>
	<script>
	if ("serviceWorker" in navigator) {
	  navigator.serviceWorker.register("service-worker.js");
	}

	</script>
	
	<script id="xml-data" type="text/xml">
	<!-- your XML questions here -->
	</script>

</body>
</html>
